<!DOCTYPE html>
<html>
<head>
  <title>Check Input on Button Click</title>
  <style>
    body {
      background-color: #00002F;
      color: white; /* Optional: makes text visible */
      margin: 0;
      padding: 0;

      
 
    }
    .my-button {
      background-color: #39FF14;
      
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-color: black;
    }
    .my-button:hover {
      background-color: #39FF14;
      
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      filter: brightness(85%);
      font-color: black;
    }
    p {
	    color: #39FF14;
	    
	    }
	 label {
		 color: #39FF14;
		 }
	input {
		background-color: #39FF14;
		border-radius: 10px;
		}
	a {
		color: #39FF14;
		}
.centered-div {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: black;
  padding: 20px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}   
  </style>
</head>
<audio id="myAudio" src="audio.mp3"></audio>
 
<body>
	<div class="centered-div">
	<div>	
  <label for="textInput">Enter Password:</label>
  
  <input type="text" id="textInput"> 
	  </div><br>
	    <button class="my-button" id="checkButton">Verrify</button>
  <p id="result"></p>

  <script>
	  
    const textInput = document.getElementById('textInput');
    const checkButton = document.getElementById('checkButton');
    const result = document.getElementById('result');

    checkButton.addEventListener('click', function() {
      const text = textInput.value.trim();
      if (text === 'cheese') {
	     document.getElementById('myAudio').play()
        result.innerHTML = '<a href="https://jeff-web-sketch.github.io/minecraftmods/">Click here</a> ';
      } else {
        result.textContent = `You entered: "${text}"`;
      }
    });
  </script>
  <p>© 2026 The Birthday Program, do not distribute!</p>
  </div>
</body>

</html>
